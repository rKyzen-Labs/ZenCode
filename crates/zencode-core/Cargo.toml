[package]
name = "zencode-core"
version = "0.1.0"
edition = "2021"
description = "Core domain types, routing policies, and security services for Zencode"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.43", features = ["full"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
]
