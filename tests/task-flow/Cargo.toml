[package]
name = "task-flow"
version = "0.1.0"
edition = "2021"

[dependencies]
zencode-core = { path = "../../crates/zencode-core" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
futures-util = "0.3"
rand = "0.8"
base64 = "0.22"
