name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - name: Install Node dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --dir apps/desktop build

      - name: Build Tauri app (.exe, .deb, .rpm, .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZenCode ${{ github.ref_name }}'
          releaseBody: |
            ZenCode: The director-supervised, safety-first autonomous AI coding assistant.
            
            ### Downloads
            - **Windows**: `.exe` (NSIS Installer)
            - **Linux**: `.deb` (Debian/Ubuntu) & `.rpm` (Fedora/RHEL)
            - **macOS**: `.dmg` (Apple Silicon & Intel Universal)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
