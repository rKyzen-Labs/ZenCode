name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            args: '--bundles dmg --target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
        shell: bash

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - name: Install Node dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter zencode-desktop build

      - name: Build Tauri app (.exe, .deb, .rpm, .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'ZenCode ${{ github.ref_name }}'
          releaseBody: |
            ZenCode: The director-supervised, safety-first autonomous AI coding assistant.
            
            ### Included Release Assets:
            - **Linux ELF Binary**: `zencode-linux-x86_64` (Native 64-bit ELF standalone executable)
            - **Debian / Ubuntu**: `zencode_${{ github.ref_name }}_amd64.deb` (Debian package with auto-resolved dependencies)
            - **Universal Linux**: `zencode_${{ github.ref_name }}_amd64.AppImage`
            - **Windows**: `Zencode_${{ github.ref_name }}_x64-setup.exe` (NSIS Installer with automatic WebView2 Bootstrapper download)
            - **macOS**: `Zencode_${{ github.ref_name }}_universal.dmg` (Universal binary for both Apple Silicon M-series & Intel Macs)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Linux ELF binary and artifacts
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "target/release/zencode-desktop" ]; then
            cp target/release/zencode-desktop target/release/zencode-linux-x86_64
          elif [ -f "apps/desktop/src-tauri/target/release/zencode-desktop" ]; then
            mkdir -p target/release
            cp apps/desktop/src-tauri/target/release/zencode-desktop target/release/zencode-linux-x86_64
          fi
          chmod +x target/release/zencode-linux-x86_64
          gh release upload ${{ github.ref_name }} target/release/zencode-linux-x86_64 --clobber || true

      - name: Archive Linux ELF and Debian package
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: zencode-linux-x86_64-binaries
          path: |
            target/release/zencode-linux-x86_64
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
